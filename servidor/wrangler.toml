# Servidor del bot oficial de WaveMascot. Publicar: ver servidor/README.md
name = "wavemascot"
main = "worker.js"
compatibility_date = "2025-09-01"

# GIF y fotos del bot (los genera generar_imagenes.py): se sirven en /img/...
[assets]
directory = "./publico"
binding = "ASSETS"

# Datos mínimos: instalaciones, códigos de 15 minutos y los file_id de los GIF.
# El id lo crea "npx wrangler kv namespace create DATOS".
[[kv_namespaces]]
binding = "DATOS"
id = "9b5fa84dcefa40e3aa6f7d402eb48bcb"

# WaveMascot Pro (avisos y permisos por Telegram). COBRAR = "no" apaga el cobro y todo vuelve a ser gratis.
# Precios en Telegram Stars. Opcionales, como secretos (npx wrangler secret put ...):
#   DUENO        tu id de chat (mandale /id al bot): te llegan los pagos y el soporte, y usás /regalar etc.
#   CLAVE_SETUP  si está, /setup pide ?clave=...
[vars]
COBRAR = "si"
DIAS_PRUEBA = "7"
PRECIO_MENSUAL = "100"
PRECIO_VITALICIO = "1500"

# Máximo 20 avisos por minuto por instalación.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Pedidos de permiso (Permitir / Denegar desde Telegram): consistencia fuerte y respuesta al instante.
[[durable_objects.bindings]]
name = "PERMISOS"
class_name = "Permisos"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Permisos"]
