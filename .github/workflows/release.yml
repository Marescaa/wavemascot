name: Release

# Al pushear un tag v* (por ejemplo v1.2.0): pruebas, build del instalador .exe (Windows) y de los .dmg
# (Mac con Apple Silicon y con Intel), y release con todo adjunto.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Versión del tag = versión del código
        shell: pwsh
        run: |
          $version = (Select-String -Path mascota.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con __version__ = $version en mascota.py"
          }

      - name: Dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover tests -v

      - name: Build del instalador
        shell: pwsh
        run: ./build.ps1 -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/WaveMascot-Setup.exe

  mac:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]  # Apple Silicon e Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover tests -v

      - name: Build de la app y el .dmg
        run: PYTHON=python ./build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: dist/*.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La sección de esta versión en el CHANGELOG va al principio de las notas: la app la lee para
      # mostrar qué trae la versión nueva (actualizacion.py busca "What's new").
      - name: Novedades
        id: novedades
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {dentro=1; next} dentro && index($0, "## [") == 1 {exit} dentro' \
            CHANGELOG.md | sed '/^### Added$/d' > novedades.md
          { echo 'texto<<FIN_NOVEDADES'; cat novedades.md; echo 'FIN_NOVEDADES'; } >> "$GITHUB_OUTPUT"
          cat novedades.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS.txt
        run: |
          cd dist
          sha256sum WaveMascot-Setup.exe WaveMascot-Mac-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WaveMascot-Setup.exe
            dist/WaveMascot-Mac-AppleSilicon.dmg
            dist/WaveMascot-Mac-Intel.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## What's new

            ${{ steps.novedades.outputs.texto }}

            ## Download

            | Your computer | File |
            |---|---|
            | Windows 10 or 11 | [`WaveMascot-Setup.exe`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WaveMascot-Setup.exe) |
            | Mac with an Apple chip (M1, M2, M3, M4…) | [`WaveMascot-Mac-AppleSilicon.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WaveMascot-Mac-AppleSilicon.dmg) |
            | Mac with an Intel processor | [`WaveMascot-Mac-Intel.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WaveMascot-Mac-Intel.dmg) |

            **Windows**: open the `.exe` and click **Yes**.
            **Mac** (macOS 13 or newer): open the `.dmg`, drag **WaveMascot** onto **Applications** and open it. The first
            time, allow it in **System Settings → Privacy & Security → Open Anyway**, then click **Yes**.

            Step by step: [English](https://github.com/${{ github.repository }}#install) ·
            [Español](https://github.com/${{ github.repository }}/blob/main/README.es.md#instalación) ·
            [Português](https://github.com/${{ github.repository }}/blob/main/README.pt.md#instalação).
            Check the files with `SHA256SUMS.txt`.
