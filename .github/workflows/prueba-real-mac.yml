name: Prueba real en Mac (temporal)

# Solo para la rama mac: build de la app, prueba de punta a punta en una Mac real y los resultados
# (resumen, capturas y logs) en la rama pruebas-mac-<chip>. Se borra antes de unir a main.
on:
  push:
    branches: [mac]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            chip: AppleSilicon
          - runner: macos-15-intel
            chip: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Pruebas unitarias
        run: |
          mkdir -p resultados
          python -m unittest discover tests -v 2>&1 | tee resultados/pruebas-unitarias.txt

      - name: Build
        run: PYTHON=python ./build-mac.sh 2>&1 | tee resultados/build.txt

      - name: Prueba real
        if: always()
        timeout-minutes: 25
        run: build/venv-mac/bin/python pruebas_mac/real.py

      - name: Resultados a la rama pruebas-mac-${{ matrix.chip }}
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resultados
          cd resultados
          git init -q -b r
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Resultados ${GITHUB_SHA::7} ${{ matrix.chip }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" r:refs/heads/pruebas-mac-${{ matrix.chip }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Pruebas y build del .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resultados | Out-Null
          python -m unittest discover tests -v 2>&1 | Tee-Object resultados/pruebas-unitarias.txt
          if ($LASTEXITCODE -ne 0) { throw "pruebas" }
          ./build.ps1 -Python python 2>&1 | Tee-Object resultados/build.txt
          Get-Item dist/WaveMascot-Setup.exe | Select-Object Name, Length | Out-File resultados/exe.txt

      - name: Resultados a la rama pruebas-windows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resultados
          cd resultados
          git init -q -b r
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Resultados ${GITHUB_SHA::7} Windows"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" r:refs/heads/pruebas-windows
