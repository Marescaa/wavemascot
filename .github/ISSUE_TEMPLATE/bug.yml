name: Reportar un error
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por avisar! Antes de enviar, revisá que no haya un issue parecido abierto.
        **No pegues datos privados**: el log puede incluir títulos de chats, nombres de proyectos o fragmentos de
        respuestas; borralos antes de pegarlo.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas que pasara y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Configurar ...
        2. Pedirle a Claude Code ...
        3. La mascota ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la mascota
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: instalacion
    attributes:
      label: Cómo la instalaste
      options:
        - Instalador .exe
        - install.ps1 (código fuente)
        - A mano
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 23H2"
  - type: dropdown
    id: claude
    attributes:
      label: Dónde usás Claude Code
      multiple: true
      options:
        - Terminal (CLI)
        - App de escritorio
        - Extensión de VS Code
        - Extensión de JetBrains
        - Otro
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Las últimas líneas de `%USERPROFILE%\.wavemascot\mascota.log` (sin datos privados).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Algo más
      description: Capturas, varios monitores, modo compañera, configuración que cambiaste, etc.
