name: Bug report
description: Something doesn't work as it should. (Español y português también.)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before sending, check there isn't a similar open issue.
        You can write in English, Spanish or Portuguese.
        **Don't paste private data**: the log can include chat titles, project names or bits of answers; remove them
        before pasting it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Set ...
        2. Ask Claude Code to ...
        3. The mascot ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WaveMascot version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Windows .exe installer
        - Windows install.ps1 (source)
        - Mac app (.dmg)
        - Mac install.sh (source)
        - By hand
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Español
        - Português
  - type: input
    id: windows
    attributes:
      label: System
      description: Windows or macOS version (on Mac, also Apple chip or Intel).
      placeholder: "Windows 11 23H2 / macOS 15.3, Apple M2"
  - type: dropdown
    id: claude
    attributes:
      label: Where you use Claude Code
      multiple: true
      options:
        - Terminal (CLI)
        - Desktop app
        - VS Code extension
        - JetBrains extension
        - Other
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of `~/.wavemascot/mascota.log` (on Windows, `%USERPROFILE%\.wavemascot\mascota.log`), without private data.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, multiple monitors, companion mode, settings you changed, etc.
