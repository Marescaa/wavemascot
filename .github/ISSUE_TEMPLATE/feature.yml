name: Suggest an idea
description: A new feature or an improvement for the mascot. (Español y português también.)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to solve
      description: Describe the use case — what happens today and why this would help. English, Spanish or Portuguese.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you picture it
      description: How it should look or work. If it's a new state, accessory or animation, a sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Before sending
      options:
        - label: The idea works offline and without sending data off the computer.
          required: true
        - label: It doesn't need logos, images or other assets from Anthropic or third parties without a compatible license.
          required: true
